name: AI starter checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: AI readiness check
        run: npm run check:ai

      - name: Environment doctor
        run: npm run doctor

      - name: Example syntax check
        working-directory: examples/minimal-oauth-service
        run: npm run check

      - name: Smoke example
        run: npm run smoke:example
